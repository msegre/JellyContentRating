framework: "net8.0"
overview: "Tag movies as Kid, Teen, or All, and use Jellyfin's built-in user tag restrictions to filter content by age group."
description: >
  Adds a dashboard page for tagging movies as Kid, Teen, or All (stored as
  regular Jellyfin tags), plus a best-effort injected menu item on the item
  three-dot menu for the same purpose. Filtering itself is done with
  Jellyfin's native "Allowed Tags" parental control feature, not by this
  plugin -- so enforcement is not dependent on the plugin staying installed.
